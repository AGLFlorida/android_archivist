version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - '@biomejs/*'
          - '@types/*'
          - typescript
      runtime-deps:
        patterns:
          - tsx

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      python-dev:
        patterns:
          - pytest
          - ruff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns:
          - '*'
