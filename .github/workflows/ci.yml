name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: npm ci

      - run: pip install -r requirements-dev.txt

      - run: npm run lint

      - run: npm run lint:py

      - run: npm test

      - run: npm run test:py

      - run: npx tsc --noEmit
